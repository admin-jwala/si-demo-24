/* ---------- charts ---------- */
function donut(parts,big,small){const tot=parts.reduce((a,p)=>a+p.v,0)||1,C=2*Math.PI*42;let off=0;
 return `<svg viewBox="0 0 120 120" class="donut">${parts.map(p=>{const len=p.v/tot*C,s=`<circle cx="60" cy="60" r="42" fill="none" stroke="${p.c}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len;return s}).join("")}<text x="60" y="60" text-anchor="middle" class="dn">${big}</text><text x="60" y="76" text-anchor="middle" class="ds">${small}</text></svg>`;}
const legend=parts=>`<div class="lg">${parts.map(p=>`<span><i style="background:${p.c}"></i>${p.l} <b>${p.t||p.v}</b></span>`).join("")}</div>`;
function statusDonut(s){const p=[{v:s.confirmed,c:"var(--red)",l:"Confirmed by Jwala experts"},{v:s.cleared,c:"var(--ok)",l:"Cleared as false alarms"},{v:s.pending,c:"var(--warn)",l:"Still in review"}];
 return `<div class="donutw">${donut(p,num(s.flagged),"flagged")}${legend(p)}</div>`;}
function hbars(items,max){max=max||Math.max(...items.map(x=>x.v),1);return items.map(x=>`<${x.attr?"button":"div"} class="hb" ${x.attr||""}><span>${x.icon?ic(x.icon)+" ":""}${x.l}${x.sub?`<br><small class="m">${x.sub}</small>`:""}</span><span class="tr">${(x.parts||[{v:x.v,c:x.c||"var(--ink)"}]).map(p=>`<i style="width:${p.v/max*100}%;background:${p.c}"></i>`).join("")}</span><span class="val">${x.t}</span></${x.attr?"button":"div"}>`).join("");}
function gauge(h,buf){const max=30,a=v=>Math.PI*(1-Math.min(v,max)/max),pt=(v,r)=>[60+r*Math.cos(a(v)),62-r*Math.sin(a(v))],[x,y]=pt(h,44),[bx,by]=pt(buf,54),[bx2,by2]=pt(buf,34),low=h<buf;
 return `<svg viewBox="0 0 120 74"><path d="M16 62A44 44 0 01104 62" fill="none" stroke="var(--soft)" stroke-width="12" stroke-linecap="round"/><path d="M16 62A44 44 0 01${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${low?"var(--red)":"var(--ok)"}" stroke-width="12" stroke-linecap="round"/><line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${bx2.toFixed(1)}" y2="${by2.toFixed(1)}" stroke="var(--ink)" stroke-width="2"/><text x="60" y="60" text-anchor="middle" class="dn" style="font-size:18px">${h}%</text></svg>`;}
function trend(){const days=21,arr=Array(days).fill(0);ALL.filter(f=>f.status==="confirmed"&&f.kind!=="exposure").forEach(f=>arr[days-f.ago]+=f.amount);let c=0;const cum=arr.map(v=>c+=v),mx=c||1,W=600,H=150;
 const pts=cum.map((v,i)=>`${(i/(days-1)*W).toFixed(1)},${(H-v/mx*(H-12)).toFixed(1)}`).join(" ");
 return `<svg viewBox="0 0 ${W} ${H+22}" style="width:100%;height:auto"><polygon points="0,${H} ${pts} ${W},${H}" fill="var(--redbg)"/><polyline points="${pts}" fill="none" stroke="var(--red)" stroke-width="3"/><text x="0" y="${H+18}" class="ds">Day 1</text><text x="${W}" y="${H+18}" text-anchor="end" class="ds">Day 21 · ${money(c)}</text></svg>`;}

function impact(fs,recs,docs){const c=fs.filter(f=>f.status==="confirmed").length,cl=fs.filter(f=>f.status==="cleared").length,hrs=Math.round((c+cl)*0.75);

 const top=ALL.filter(f=>f.status==="confirmed"&&f.kind!=="exposure").sort((a,b)=>b.amount-a.amount).slice(0,5);
 return `<div class="eyebrow">Chairman's cockpit</div><h1><span class="hi">${ic("home")}</span>What Jwala found for Raymond in three weeks</h1>

 <div class="card"><h3>${ic("shield")}Money by kind</h3><div class="donutw">${donut(["recover","unlock","exposure"].map(k=>({v:T[k],c:KC[k]})),"₹ "+Math.round((T.recover+T.unlock+T.exposure)/100),"Cr in all")}${legend(["recover","unlock","exposure"].map(k=>({c:KC[k],l:KIND[k],t:money(T[k])})))}</div></div></div>
 <h2>${ic("star")}Five largest confirmed</h2><div class="card">${ftable(top,true)}</div>
 <h2>${ic("eye")}Where Raymond stands today <span class="tagp t-public">Public</span></h2><div class="grid g6">${D.public.map(p=>`<div class="card imp"><div class="v" style="font-size:21px">${p.v.replace("Rs","₹")}</div><div class="l">${p.l}</div><a class="legal" href="${p.u}" target="_blank" rel="noopener">${p.s}</a></div>`).join("")}</div>`;}

 const [vt,vh]=viz(k);const tests=m.types.map(t=>{const a=m.findings.filter(f=>f.type===t.code),c=x=>a.filter(f=>f.status===x).length;return {l:`<b>${esc(t.title)}</b>`,sub:`${ROLE[t.expert]}${t.rera?' · <span class="tagp t-syn">RERA</span>':""}`,v:a.length,t:`${c("confirmed")} of ${a.length}`,parts:[{v:c("confirmed"),c:"var(--red)"},{v:c("cleared"),c:"var(--ok)"},{v:c("pending"),c:"var(--warn)"}],attr:`data-type="${t.code}" data-mod="${k}"`}});
 return `<div class="eyebrow">${m.vertical==="realty"?"Raymond Realty":"Raymond Lifestyle"} · ${m.title}</div><h1><span class="hi">${ic(MI[k])}</span>${m.lens}</h1>
 <p class="lede">Jwala's AI read <b>${num(m.docs[0])}</b> ${m.docs[1]} and matched <b>${num(m.recs[0])}</b> ${m.recs[1]} against them. Jwala's experts reviewed everything it flagged.</p>
 ${impact(m.findings,m.recs[0])}
 <div class="grid g21" style="margin-top:14px"><div class="card"><h3>${vt}</h3>${vh}</div><div class="card"><h3>${ic("filter")}What the experts decided</h3>${statusDonut(s)}</div></div>
 <h2>${ic("scan")}What is tested, and which Jwala expert decides</h2><div class="card">${hbars(tests)}<p class="legal">Red: confirmed. Green: cleared as a false alarm. Amber: in review. Tap a test to see its findings.</p></div>
 <h2>${ic("doc")}Findings</h2><div class="chips">${[["confirmed","Confirmed"],["cleared","Cleared"],["pending","In review"],["all","All"]].map(([v,l])=>`<button class="chip ${fl.status===v?"on":""}" data-fs="${v}" data-mod="${k}">${l}</button>`).join("")}
 ${fl.type!=="all"?`<button class="chip on" data-type="all" data-mod="${k}">Test ${fl.type} ×</button>`:""}<button class="chip" data-csv="${k}">Download CSV</button></div>
 <div class="card" id="flist">${fs.length?ftable(fs.slice(0,25)):"<p>No findings match this filter.</p>"}${fs.length>25?`<p class="legal">Showing 25 of ${fs.length}, largest first. The CSV has all.</p>`:""}</div>`;}

function mapView(k){const M=MAPS[k];if(!M)return cockpit();const n=M.stages.reduce((a,s)=>a+s[4].length,0),deep=M.stages.reduce((a,s)=>a+s[4].filter(u=>u[3]).length,0);
 return `<div class="eyebrow">${M.title}</div><h1><span class="hi">${ic("map")}</span>${M.sub}: ${n} places where Jwala's AI and experts work for Raymond</h1><p class="lede">${M.lede}</p>

 return `<button class="chip" data-nav="map-${k}">${ic("back")} ${M.title} map</button><div class="eyebrow" style="margin-top:14px">${M.title} · ${s[0]}</div><h1><span class="hi">${ic(s[1])}</span>${u[0]}</h1>

function reraView(){const rows=[];for(const [k,m] of Object.entries(D.modules))for(const t of m.types)if(t.rera)rows.push({k,m,t,a:m.findings.filter(f=>f.type===t.code)});
 const fs=rows.flatMap(r=>r.a),c=x=>fs.filter(f=>f.status===x).length;const eng={};rows.forEach(r=>{eng[r.m.title]=eng[r.m.title]||{n:0,a:0,k:r.k};eng[r.m.title].n+=r.a.filter(f=>f.status==="confirmed").length;eng[r.m.title].a+=sumA(r.a);});
 return `<div class="eyebrow">Raymond Realty · RERA thread</div><h1><span class="hi">${ic("scale")}</span>One law, running through Sales, Payments, Loans and Construction</h1>
 <p class="lede">The same record is tested where it arises. Jwala's RERA counsel or forensic accountant signs off each finding before it reaches management.</p>
 <div class="grid g4">${[["","scan",rows.length,"RERA tests running across the four engines"],["","eye",fs.length,"flagged by Jwala's AI"],["red","scale",c("confirmed"),"confirmed by Jwala's experts"],["ok","filter",c("cleared"),"cleared as false alarms, with reasons"]].map(([k,i,v,l])=>`<div class="card imp ${k}"><div class="ib">${ic(i)}</div><div class="v">${v}</div><div class="l">${l}</div></div>`).join("")}</div>
 <div class="grid g21" style="margin-top:14px"><div class="card"><h3>${ic("shield")}Amount at risk under RERA, by engine</h3>${hbars(Object.entries(eng).map(([l,e])=>({l,icon:MI[e.k],v:e.a,t:money(e.a),sub:e.n+" confirmed",c:"var(--brass)",attr:`data-nav="mod-${e.k}"`})))}</div>
 <div class="card"><h3>${ic("filter")}Decisions</h3><div class="donutw">${donut([{v:c("confirmed"),c:"var(--red)"},{v:c("cleared"),c:"var(--ok)"},{v:c("pending"),c:"var(--warn)"}],fs.length,"flagged")}</div></div></div>
 <h2>${ic("doc")}The nine tests</h2><div class="card">${hbars(rows.map(r=>({l:`<b>${esc(r.t.title)}</b>`,sub:`${r.m.title} · ${esc(r.t.rule)}`,v:r.a.length,t:r.a.filter(f=>f.status==="confirmed").length+" confirmed",c:"var(--red)",parts:[{v:r.a.filter(f=>f.status==="confirmed").length,c:"var(--red)"},{v:r.a.filter(f=>f.status!=="confirmed").length,c:"var(--line)"}],attr:`data-type="${r.t.code}" data-mod="${r.k}" data-jump="1"`})))}</div>
 <p class="legal">Provisions are cited from the Real Estate (Regulation and Development) Act, 2016 and state rules for discussion. They need review by counsel before reliance.</p>`;}

function reviewView(){const q=ALL.filter(f=>f.status==="confirmed").sort((a,b)=>(a.kind==="exposure")-(b.kind==="exposure")||b.amount-a.amount),openAll=q.filter(f=>!state.approvals[f.id]),open=openAll.slice(0,12);
 const by={};ALL.forEach(f=>{const r=ROLE[typeOf(f).expert];by[r]=by[r]||{confirmed:0,cleared:0,pending:0};by[r][f.status]++;});
 return `<div class="eyebrow">How Jwala works with you</div><h1><span class="hi">${ic("check")}</span>Nothing reaches you until a Jwala expert has signed it</h1>
 <p class="lede">The AI is fast and reads everything. It is also sometimes wrong. Jwala's experts review every item and clear about a third as false alarms, so your managers see only what is real.</p>
 <div class="card"><h3>${ic("people")}Jwala's experts on this work <small>confirmed · cleared · in review</small></h3>${hbars(Object.entries(by).map(([r,c])=>({l:`<b>${r}</b>`,v:c.confirmed+c.cleared+c.pending,t:`${c.confirmed} · ${c.cleared} · ${c.pending}`,parts:[{v:c.confirmed,c:"var(--red)"},{v:c.cleared,c:"var(--ok)"},{v:c.pending,c:"var(--warn)"}]})))}</div>
 <h2>${ic("pen")}Waiting for Raymond's approval <span class="tagp t-syn">${openAll.length} open</span></h2>
 <div class="card"><div class="scroll"><table class="ft"><tr class="hd"><th>Finding</th><th>Drafted action</th><th class="n">Amount</th><th></th></tr>${open.map(f=>{const t=typeOf(f);return `<tr><td><button data-f="${f.id}" style="background:none;border:0;padding:0;text-align:left"><b>${esc(t.title)}</b></button><br><small class="m">${esc(f.entity)} · ${ROLE[t.expert]}</small></td><td>${esc(t.action)}</td><td class="n"><b class="k-${f.kind}">${money(f.amount)}</b></td>
 <td style="white-space:nowrap"><button class="btn" data-ap="${f.id}" data-d="Approved">Approve</button> <button class="btn ghost" data-ap="${f.id}" data-d="Sent back">Send back</button></td></tr>`}).join("")}</table></div></div>
 <h2>${ic("clock")}Audit trail</h2><div class="card" id="audit">${state.audit.length?`<div class="scroll"><table><tr><th>When</th><th>Finding</th><th>Decision</th><th>By</th></tr>${state.audit.map(a=>`<tr><td>${a.t}</td><td>${a.id} · ${esc(typeOf(BYID[a.id]).title)}</td><td><b>${a.d}</b></td><td>${a.by}</td></tr>`).join("")}</table></div>`:"<p style='margin:0'>No decisions yet. Approve or send back an item above.</p>"}</div>`;}

function askView(sel){const i=sel==null?0:sel,a=D.ask[i];
 return `<div class="eyebrow">Ask in plain words</div><h1><span class="hi">${ic("chat")}</span>Ask the way you would ask your CFO</h1>
 <p class="lede">Answers come only from findings a Jwala expert has confirmed, with the records behind them.</p>
 <div class="card"><input class="ask" id="askbox" placeholder="Type a question, or pick one below"><div class="chips" style="margin-bottom:0">${D.ask.map((q,j)=>`<button class="chip ${j===i?"on":""}" data-ask="${j}">${esc(q.q)}</button>`).join("")}</div><p class="legal" id="askmsg"></p></div>
 <h2>${ic("chat")}${esc(a.q)}</h2><div class="card"><div class="ans">${esc(a.a).replace(/Rs /g,"₹ ")}</div>
 <div class="grid g3" style="margin-bottom:14px"><div class="card imp red"><div class="v">${money(a.t)}</div><div class="l">total</div></div><div class="card imp"><div class="v">${a.n}</div><div class="l">confirmed findings behind this answer</div></div><div class="card imp"><div class="v">${D.modules[a.mod].title}</div><div class="l">where it comes from</div></div></div>
 ${ftable(a.ids.map(x=>BYID[x]))}<p style="margin:14px 0 0"><button class="btn ghost" data-nav="mod-${a.mod}">${ic("arrow")}Open ${D.modules[a.mod].title}</button></p></div>`;}

function howView(){const T=D.totals,recs=Object.values(D.modules).reduce((a,m)=>a+m.recs[0],0),hrs=Math.round((T.confirmed+T.cleared)*0.75),ex=Object.keys(ROLE).length;
 return `<div class="eyebrow">Impact and the team</div><h1><span class="hi">${ic("people")}</span>Jwala brings the AI and the experts. Raymond brings the records.</h1>
 <p class="lede">This is a service with a product inside it. Raymond does not buy software and then hire people to run it. Jwala delivers confirmed findings and drafted actions.</p>
 <h2>${ic("coin")}How Jwala's impact is measured <span class="tagp t-syn">Synthetic</span></h2>
 <div class="grid g4">${[["red","coin",money(T.recover),"Leakage recovered","Money paid out that should not have been"],["ok","cash",money(T.unlock),"Cash released","Money and stock that was stuck"],["brass","shield",money(T.exposure),"Risk caught early","Penalties, breaches and claims avoided"],["","scan",num(recs),"Records read","All of them, not a sample"],
 ["","clock","1 day","Record to finding","Against the next audit cycle"],["ok","filter",Math.round(T.cleared/(T.cleared+T.confirmed)*100)+"%","False alarms removed","By Jwala experts, before your team sees them"],["","people",num(hrs),"Jwala expert hours","Across "+ex+" disciplines"],["","check","0","Staff added by Raymond","Your team approves and acts"]].map(([k,i,v,h,l])=>`<div class="card imp ${k}"><div class="ib">${ic(i)}</div><div class="v">${v}</div><div class="l"><b style="color:var(--ink)">${h}</b><br>${l}</div></div>`).join("")}</div>
 <h2>${ic("people")}Who does what</h2><div class="tri"><div class="card"><h3>${ic("scan")}Jwala's AI</h3>Reads every document and record. Tests each against the contract, the policy and the law. Drafts the action.</div>
 <div class="card j"><h3>${ic("scale")}Jwala's experts and engineers</h3>Lawyers, forensic accountants, quantity surveyors and finance specialists confirm or clear each finding. Forward-deployed engineers connect your records and tune each test.</div>
 <div class="card r"><h3>${ic("check")}Raymond</h3>Gives read-only access to records. Names one person per business to approve actions. Collects the money.</div></div>
 <h2>${ic("clock")}First eight weeks</h2><div class="card">${[["Weeks 1 to 2","Pick two areas. Read-only access. Tests tuned to your contracts.","var(--ink)",0,25],["Weeks 3 to 5","AI reads everything. Jwala experts review. First confirmed findings.","var(--red)",25,37.5],["Weeks 6 to 8","Actions approved. Recoveries tracked to the bank.","var(--ok)",62.5,37.5]].map(([w,t,c,l,wd])=>`<div class="tl" style="grid-template-columns:minmax(130px,34%) 1fr"><span><b>${w}</b><br><small class="m">${t}</small></span><span class="ax" style="height:18px"><i style="left:${l}%;width:${wd}%;height:18px;top:0;margin:0;border:0;border-radius:9px;background:${c}"></i></span></div>`).join("")}</div>
 <h2>${ic("shield")}Your data</h2><div class="card">${AUTHOR} acts as Raymond's data processor and supports Raymond's obligations under the Digital Personal Data Protection Act. Access is read-only, role-based and logged. This demonstration uses no Raymond data.</div>`;}

function openFinding(id){const f=BYID[id],t=typeOf(f),ap=state.approvals[id];
 $("#drawer").innerHTML=`<button class="x" data-close="1" aria-label="Close">×</button><div class="eyebrow">${D.modules[f.mod].title} · ${f.id}</div><h2 style="margin:0 0 6px;font-size:21px;display:block">${esc(t.title)}</h2>

 <div style="margin:12px 0"><b class="k-${f.kind}" style="font-size:27px">${money(f.amount)}</b> <span style="color:var(--mute)">${KIND[f.kind]}</span> <span class="st ${f.status}">${f.status==="pending"?"in review":f.status}</span></div>
 <div class="sec"><h4><span>Jwala AI</span> What it read</h4><ol class="trail">${t.trail.map(x=>`<li>${esc(x)}</li>`).join("")}</ol><p class="legal">Match confidence ${f.conf}% · found ${f.found}</p></div>

 <div class="sec"><h4><span>Jwala AI</span> The records</h4><div class="scroll"><table><tr><th>Source</th><th>Reference</th><th>Date</th><th>What it shows</th></tr>${f.rows.map(r=>`<tr><td>${esc(r.source)}</td><td>${esc(r.ref)}</td><td>${esc(r.date)}</td><td>${esc(r.value).replace(/Rs /g,"₹ ")}</td></tr>`).join("")}</table></div></div>
 <div class="sec"><h4><span class="hu">Jwala expert</span> ${ROLE[t.expert].replace("Jwala ","")}</h4><div class="note ${f.status}">${esc(f.note)}</div></div>
 ${f.status==="confirmed"?`<div class="sec"><h4><span>Jwala AI</span> Drafted action <span class="hu">Expert-checked</span></h4><div class="draft">${esc(t.action)}</div>
 <p style="margin-top:14px">${ap?`<b>${ap.d}</b> · ${ap.t}`:`<button class="btn" data-ap="${id}" data-d="Approved">Approve</button> <button class="btn ghost" data-ap="${id}" data-d="Sent back">Send back</button>`}</p></div>`:""}
 <p class="legal">Illustrative, synthetic record. References need professional review before reliance.</p>`;
 $("#drawer").classList.add("open");$("#scrim").classList.add("open");$("#drawer").scrollTop=0;}
function closeDrawer(){$("#drawer").classList.remove("open");$("#scrim").classList.remove("open");}
function decide(id,d){if(state.approvals[id])return;const t=new Date().toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});state.approvals[id]={d,t};state.audit.unshift({id,d,t,by:"Chairman's office"});}
function csv(k){const m=D.modules[k],rows=[["id","test","where","tag","amount_rs_lakh","kind","status","expert","note"]].concat(m.findings.map(f=>{const t=typeOf(f);return [f.id,t.title,f.entity,f.tag,f.amount,f.kind,f.status,ROLE[t.expert],f.note]}));
 const s=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));a.download=`${m.title} findings.csv`;a.click();}catch(e){}return s;}

document.addEventListener("click",e=>{if(e.target.id==="scrim")return closeDrawer();if(e.target.closest("#mbtn"))return $("#menu").classList.add("open");
 const el=e.target.closest("[data-close],[data-menu],[data-ap],[data-nav],[data-csv],[data-fs],[data-type],[data-ask],[data-f]");if(!el)return;const d=el.dataset;
 if(d.close)return closeDrawer();if(d.menu)return $("#menu").classList.remove("open");
 if(d.ap){e.preventDefault();decide(d.ap,d.d);const inD=$("#drawer").classList.contains("open");if(state.cur==="review")$("#view").innerHTML=reviewView();paint();if(inD)openFinding(d.ap);return;}
 if(d.nav)return render(d.nav);

 if(d.type){state.filter[d.mod]=state.filter[d.mod]||{status:"confirmed"};state.filter[d.mod].type=d.type;render("mod-"+d.mod);const fl=$("#flist");if(fl&&!d.jump&&d.type!=="all")try{fl.scrollIntoView({block:"start"})}catch(x){}return;}

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();
 if(e.key==="Enter"&&e.target.id==="askbox"){const q=e.target.value.toLowerCase(),W=[["contractor bill rate drawing",0],["rera designated account outside",1],["demand stage certified milestone",2],["loan homebuyer disburs bank collect",3],["jda promise society rent missed",4],["brokerage broker channel partner",5],["store cash deposit upi card",6],["stock inventory working capital aged",7]];
  let best=-1,sc=0;W.forEach(([w,i])=>{const s=w.split(" ").filter(x=>q.includes(x)).length;if(s>sc){sc=s;best=i;}});
  if(best>=0)$("#view").innerHTML=askView(best);else $("#askmsg").textContent="This demonstration answers the eight questions shown. In a live deployment the same box answers any question the confirmed findings can support.";}});
window.__api={render,openFinding,decide,csv,state,ALL,MAPS,askView};
render((location.hash||"").slice(1)||"cockpit");
